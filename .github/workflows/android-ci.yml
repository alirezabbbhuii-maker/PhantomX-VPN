name: Phantom X build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: project
        run: |
          find_settings() {
            find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -n 1
          }
          settings="$(find_settings)"
          if [ -z "$settings" ]; then
            for archive in $(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*'); do
              if unzip -l "$archive" | grep -q 'settings\.gradle\.kts'; then
                echo "Unpacking $archive"
                unzip -q -o "$archive" -d _project
                break
              fi
            done
            settings="$(find_settings)"
          fi
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts not found"
            find . -maxdepth 3 -not -path './.git/*' | sort | head -n 100
            exit 1
          fi
          dir="$(dirname "$settings")"
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
